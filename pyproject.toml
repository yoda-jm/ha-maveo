[project]
name = "ha-maveo"
version = "1.0.0"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE"]

[tool.mypy]
strict = true
python_version = "3.13"
packages = ["custom_components.maveo", "tests"]

[[tool.mypy.overrides]]
module = ["Crypto.*", "pytest_homeassistant_custom_component.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
